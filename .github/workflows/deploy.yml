# Publica únicamente el contenido de /public en GitHub Pages.
# tools/, .env y cualquier secreto nunca entran al artifact.
name: Deploy a Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir artifact (solo public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Desplegar a Pages
        id: deployment
        uses: actions/deploy-pages@v4
